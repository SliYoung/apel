<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Apel Pagi Otomatis | Rutan Kelas IIB Painan</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #0f172a, #1e1b4b);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

.sakura {
    position: fixed;
    top: -10%;
    width: 12px;
    height: 12px;
    background: pink;
    border-radius: 50% 50% 50% 0;
    opacity: 0.7;
    transform: rotate(45deg);
    animation: fall linear infinite;
}

@keyframes fall {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(120vh) rotate(360deg); opacity: 0; }
}

.container {
    position: relative;
    z-index: 2;
    text-align: center;
    background: rgba(30, 41, 59, 0.85);
    backdrop-filter: blur(8px);
    padding: 30px;
    border-radius: 14px;
    width: 360px;
}

.jam {
    font-size: 22px;
    margin-bottom: 15px;
    font-weight: bold;
}

button {
    font-size: 16px;
    padding: 14px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    width: 100%;
    margin-top: 10px;
    font-weight: bold;
}

.btn-aktif { background: #22c55e; }
.btn-manual { background: #3b82f6; }

.status {
    margin-top: 15px;
    font-size: 14px;
}
</style>
</head>

<body>

<script>
for (let i = 0; i < 20; i++) {
    const s = document.createElement("div");
    s.className = "sakura";
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = (8 + Math.random() * 6) + "s";
    s.style.animationDelay = Math.random() * 5 + "s";
    document.body.appendChild(s);
}
</script>

<div class="container">
    <h2>🌸 APEL PAGI OTOMATIS</h2>
    <div class="jam" id="jamSekarang">--:--:--</div>

    <button class="btn-aktif" onclick="aktifkanAudio()">AKTIFKAN SISTEM APEL</button>
    <button class="btn-manual" onclick="panggilManual()">🔔 PANGGIL MANUAL</button>

    <div class="status" id="statusAudio">🔴 Audio belum aktif</div>
</div>

<!-- AUDIO -->
<audio id="bell" src="ringtone Hp bell bandara.mp3"></audio>
<audio id="suara1" src="Mohon perhatian Sebe.mp3"></audio>
<audio id="dentang" src="School Bell Sound Effect _ Free Creative Resources (mp3cut.net) (1).mp3"></audio>
<audio id="suara2" src="Waktu sudah menunjuk (1).mp3"></audio>

<script>
const JAM_APEL = 14;
const MENIT_APEL = 18;
const DURASI_BELL = 5; // 🔥 FIX 5 DETIK

let audioUnlocked = false;
let sudahDipanggil = false;

const bell = document.getElementById("bell");
const suara1 = document.getElementById("suara1");
const dentang = document.getElementById("dentang");
const suara2 = document.getElementById("suara2");

function delay(d) {
    return new Promise(r => setTimeout(r, d * 1000));
}

function playAudio(audio) {
    return new Promise(res => {
        audio.currentTime = 0;
        audio.volume = 1;
        audio.play();
        audio.onended = res;
    });
}

function playAudioDurasi(audio, detik) {
    return new Promise(res => {
        audio.currentTime = 0;
        audio.volume = 1;
        audio.play();
        setTimeout(() => {
            audio.pause();
            audio.currentTime = 0;
            res();
        }, detik * 1000);
    });
}

function aktifkanAudio() {
    bell.play().then(() => {
        bell.pause();
        bell.currentTime = 0;
        audioUnlocked = true;
        statusAudio.innerText = "🟢 Audio aktif";
    });
}

async function panggilApel() {
    if (!audioUnlocked) return;

    await playAudioDurasi(bell, DURASI_BELL); // 🔔 bell awal
    await delay(1.5);

    await playAudio(suara1);
    await delay(1.5);

    await playAudio(dentang);
    await delay(1);

    await playAudio(suara2);
    await delay(1.5);

    await playAudioDurasi(bell, DURASI_BELL); // 🔔 bell AKHIR
}

function panggilManual() {
    if (!audioUnlocked) return alert("Aktifkan audio terlebih dahulu");
    panggilApel();
}

function updateJam() {
    jamSekarang.innerText = new Date().toLocaleTimeString("id-ID");
}

function cekJadwal() {
    const n = new Date();
    if (
        audioUnlocked &&
        n.getHours() === JAM_APEL &&
        n.getMinutes() === MENIT_APEL &&
        n.getSeconds() === 0 &&
        !sudahDipanggil
    ) {
        panggilApel();
        sudahDipanggil = true;
    }
}

setInterval(() => {
    updateJam();
    cekJadwal();
}, 1000);
</script>

</body>
</html>
